  yetipl.bugs.manage: {default: op}
  yetipl.itemdisguise: {default: op}
  yetipl.disguise: {default: op}
  yetipl.ban: {default: op}
  yetipl.banip: {default: op}
  yetipl.banlist: {default: op}
  yetipl.vanish: {default: op}
  yetipl.vanish.see: {default: op}
